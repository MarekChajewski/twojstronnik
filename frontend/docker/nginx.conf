server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Formularz: trafia do backendu w sieci Dockera, backend nie publikuje portu na VPS.
    location = /api/contact {
        # Docker DNS rozwiązuje nazwę kontenera ponownie po jego odtworzeniu.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contact_backend contact:3107;
        proxy_pass http://$contact_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Wzorzec konfiguracji na VPS NADPISUJE X-Real-IP wartością $remote_addr.
        # Nie bierzemy tutaj X-Forwarded-For jako źródła zaufanego IP.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_buffering off;
    }

    location ^~ /api/ { return 404; }

    # Przyjazna strona błędu, nadal z prawdziwym kodem HTTP 404.
    location = /404.html { internal; }

    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }

    # Astro generuje dla /podstrona/ plik /podstrona/index.html.
    location / {
        try_files $uri $uri/ =404;
    }
}
