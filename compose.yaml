services:
  contact:
    build:
      context: ./contact-server
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: "3107"
      BIND_HOST: 0.0.0.0
      TRUST_PROXY: "true"
      # Lokalny podgląd i ewentualne publiczne adresy z .env.docker.
      ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-8093},http://127.0.0.1:${WEB_PORT:-8093},${ALLOWED_ORIGINS:-https://twojstronnik.pl,https://www.twojstronnik.pl}"
    expose:
      - "3107"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3107/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8093}:80"
    depends_on:
      contact:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
