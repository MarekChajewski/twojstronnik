# W istniejącym bloku server { ... } dla HTTPS twojstronnik.pl:
# ZASTĄP aktualne location /, zamiast tworzyć drugi blok o tej samej nazwie.
# Jeśli twój istniejący Nginx ma własne reguły (np. certyfikaty i przekierowania), zostaw je.
location / {
    proxy_pass http://127.0.0.1:8093;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Host musi nadpisać ten nagłówek (nie przyjmować go z żądania klienta).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
# Port 8093 powinien odpowiadać WEB_PORT z .env.docker.
# Jeśli masz osobne location dla /api/contact ze starego wdrożenia,
# usuń je lub zastąp odpowiednim proxy do 127.0.0.1:8093.
